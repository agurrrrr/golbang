[workspace]
resolver = "2"
members = [
    "golbang-server",
    "golbang-core",
    "golbang-sys",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agurrrrr/golbang"

# 공통 의존성은 여기서 버전을 통일 관리한다.
[workspace.dependencies]
# async 런타임 / HTTP
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3"

# 직렬화
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 에러 / 로깅
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 내부 크레이트
golbang-core = { path = "golbang-core" }
golbang-sys = { path = "golbang-sys" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
